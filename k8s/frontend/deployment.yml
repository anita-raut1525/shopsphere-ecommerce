apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopsphere

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: anitaraut/shopsphere-frontend:v1

          ports:
            - containerPort: 3000

          imagePullPolicy: Always # Always pull the image if it is not present on the node