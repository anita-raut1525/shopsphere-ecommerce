apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shopsphere

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: anitaraut/shopsphere-backend:v1

          ports:
            - containerPort: 8081

          imagePullPolicy: Always # Always pull the image if it is not present on the node

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret