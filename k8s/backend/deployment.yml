apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: shopsphere

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: anitaraut/shopsphere-backend:v1

          ports:
            - containerPort: 8081

          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          startupProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 20
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"